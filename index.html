<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>寻宝之旅 · JavaScript 异步探险</title>
<style>
  :root {
    --paper: #f4ecdd;
    --card: #fffdf8;
    --ink: #2f2a24;
    --ink-2: #6d6255;
    --ink-3: #a2958a;
    --line: #e7dbc5;
    --brand: #c2410c;
    --brand-soft: #fbe6d9;
    --gold: #c99a2e;
    --teal: #0f766e;
    --shadow-sm: 0 2px 8px rgba(96, 70, 38, .07);
    --shadow: 0 14px 40px rgba(96, 70, 38, .13);
    --radius: 18px;
    --serif: "Noto Serif SC", "Songti SC", "SimSun", "Source Han Serif SC", serif;
    --sans: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", "Cascadia Code", "Consolas", "SFMono-Regular", monospace;
  }

  * { box-sizing: border-box; }

  html { height: 100%; }

  body { min-height: 100%; display: flex; }

  body {
    margin: 0;
    font-family: var(--sans);
    color: var(--ink);
    background:
      radial-gradient(1100px 520px at 12% -8%, #fffaf1 0%, rgba(255, 250, 241, 0) 60%),
      radial-gradient(900px 500px at 92% 2%, #fbf1e0 0%, rgba(251, 241, 224, 0) 62%),
      var(--paper);
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .5;
    background-image:
      repeating-linear-gradient(0deg, rgba(150, 120, 80, .035) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(150, 120, 80, .025) 0 1px, transparent 1px 4px);
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    width: min(100%, calc((100vh - 208px) * 1.7857 + 52px));
    max-width: 1240px;
    margin: auto;
    padding: 26px 26px 34px;
  }

  /* ---------------- 顶栏 ---------------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }

  .brand { display: flex; align-items: center; gap: 14px; }

  .seal {
    width: 46px; height: 46px;
    border-radius: 12px;
    display: grid; place-items: center;
    font-family: var(--serif);
    font-size: 22px;
    color: #fff8ec;
    background: linear-gradient(145deg, #d4531a, #a6360a);
    box-shadow: 0 8px 18px rgba(164, 54, 10, .28), inset 0 1px 0 rgba(255,255,255,.35);
    letter-spacing: 0;
  }

  h1 {
    margin: 0;
    font-family: var(--serif);
    font-size: 23px;
    font-weight: 700;
    letter-spacing: .5px;
    line-height: 1.3;
  }

  h1 .dot { color: var(--gold); margin: 0 2px; }

  .sub {
    margin: 3px 0 0;
    font-size: 12.5px;
    color: var(--ink-3);
    letter-spacing: .6px;
  }

  .controls { display: flex; align-items: center; gap: 10px; }

  .seg {
    display: flex;
    padding: 3px;
    background: rgba(255, 253, 248, .8);
    border: 1px solid var(--line);
    border-radius: 11px;
    box-shadow: var(--shadow-sm);
  }

  .seg button {
    border: 0;
    background: transparent;
    font-family: var(--sans);
    font-size: 12.5px;
    color: var(--ink-2);
    padding: 6px 11px;
    border-radius: 8px;
    cursor: pointer;
    transition: all .18s ease;
  }

  .seg button:hover { color: var(--brand); }

  .seg button.on {
    background: #fff;
    color: var(--brand);
    font-weight: 600;
    box-shadow: 0 1px 4px rgba(96, 70, 38, .14);
  }

  .btn {
    font-family: var(--sans);
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: .4px;
    padding: 9px 18px;
    border-radius: 11px;
    cursor: pointer;
    transition: transform .16s ease, box-shadow .2s ease, background .2s ease, color .2s ease;
    border: 1px solid transparent;
  }

  .btn.primary {
    color: #fff9f1;
    background: linear-gradient(145deg, #d4541c, #a8380c);
    box-shadow: 0 8px 20px rgba(164, 54, 10, .26);
  }

  .btn.primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 11px 24px rgba(164, 54, 10, .3); }
  .btn.primary:active:not(:disabled) { transform: translateY(0); }
  .btn.primary:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }

  .btn.ghost {
    background: rgba(255, 253, 248, .85);
    border-color: var(--line);
    color: var(--ink-2);
    box-shadow: var(--shadow-sm);
  }

  .btn.ghost:hover { color: var(--brand); border-color: #e0c9ad; }

  /* ---------------- 布局 ---------------- */
  .stage-wrap {
    max-width: 1180px;
    margin: 0 auto;
  }

  .stage-actions {
    display: flex;
    justify-content: center;
    margin-top: 22px;
  }

  .btn.lg {
    font-size: 15px;
    padding: 13px 46px;
    border-radius: 13px;
    letter-spacing: 3px;
  }

  /* ---------------- 舞台 ---------------- */
  .stage {
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    background: #f8eeda;
    border: 1px solid #e3d3b8;
    box-shadow: var(--shadow), inset 0 0 0 1px rgba(255, 255, 255, .6);
    height: min(660px, calc(100vh - 208px));
    width: auto;
    max-width: 100%;
    aspect-ratio: 1000 / 560;
    margin: 0 auto;
    isolation: isolate;
  }

  .stage::after {
    content: "";
    position: absolute;
    inset: 9px;
    border: 1px dashed rgba(140, 105, 62, .28);
    border-radius: 12px;
    pointer-events: none;
  }

  #scene { display: block; width: 100%; height: 100%; }

  .stage.shake { animation: shake .42s cubic-bezier(.36, .07, .19, .97); }

  @keyframes shake {
    10%, 90% { transform: translate(-2px, 0); }
    20%, 80% { transform: translate(4px, -1px); }
    30%, 50%, 70% { transform: translate(-6px, 1px); }
    40%, 60% { transform: translate(6px, 0); }
  }

  /* 顶部进度 */
  .stage-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px 0;
    z-index: 3;
  }

  .progress {
    flex: 1;
    height: 4px;
    border-radius: 999px;
    background: rgba(160, 128, 88, .18);
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0;
    border-radius: 999px;
    background: linear-gradient(90deg, #e8a44a, #c2410c);
    transition: width .55s cubic-bezier(.4, 0, .2, 1);
  }

  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: #7c6a53;
    background: rgba(255, 253, 248, .82);
    border: 1px solid rgba(200, 175, 140, .5);
    padding: 4px 10px;
    border-radius: 999px;
    backdrop-filter: blur(6px);
    white-space: nowrap;
  }

  .status i {
    width: 6px; height: 6px; border-radius: 50%;
    background: #b7a892;
    display: inline-block;
  }

  .status.live i {
    background: #16a34a;
    box-shadow: 0 0 0 0 rgba(22, 163, 74, .5);
    animation: ping 1.5s infinite;
  }

  @keyframes ping {
    0% { box-shadow: 0 0 0 0 rgba(22, 163, 74, .45); }
    70% { box-shadow: 0 0 0 7px rgba(22, 163, 74, 0); }
    100% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); }
  }

  /* 说明卡片 */
  .caption {
    position: absolute;
    left: 22px;
    top: 52px;
    width: min(430px, 56%);
    padding: 14px 16px 15px;
    border-radius: 14px;
    background: rgba(255, 253, 248, .9);
    border: 1px solid rgba(206, 180, 142, .55);
    box-shadow: 0 10px 26px rgba(96, 70, 38, .13);
    backdrop-filter: blur(8px);
    z-index: 3;
    transition: opacity .35s ease, transform .35s ease;
  }

  .cap-head {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 7px;
  }

  .cap-index {
    font-size: 10.5px;
    letter-spacing: .8px;
    color: #a8683a;
    background: #fbe9d9;
    border: 1px solid #f0d3ba;
    border-radius: 6px;
    padding: 2px 7px;
    white-space: nowrap;
  }

  .cap-title {
    font-family: var(--serif);
    font-size: 15.5px;
    font-weight: 700;
    color: #3a2d20;
    letter-spacing: .4px;
  }

  .cap-text {
    margin: 0;
    font-size: 13px;
    line-height: 1.72;
    color: #6b5a47;
    min-height: 44px;
  }

  .cap-text::after {
    content: "";
    display: inline-block;
    width: 2px; height: 13px;
    margin-left: 2px;
    vertical-align: -2px;
    background: var(--brand);
    opacity: 0;
  }

  .cap-text.typing::after { opacity: 1; animation: caret .8s steps(1) infinite; }

  @keyframes caret { 50% { opacity: 0; } }

  /* 罗盘 */
  .compass {
    position: absolute;
    right: 22px;
    top: 46px;
    width: 54px; height: 54px;
    opacity: .68;
    z-index: 2;
    pointer-events: none;
  }

  /* 结算层 */
  .finale {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(255, 250, 240, .58);
    backdrop-filter: blur(5px);
    opacity: 0;
    visibility: hidden;
    transition: opacity .5s ease, visibility .5s;
    z-index: 6;
  }

  .finale.show { opacity: 1; visibility: visible; }

  .finale-card {
    width: min(468px, 90%);
    text-align: center;
    padding: 26px 26px 24px;
    border-radius: 20px;
    background: rgba(255, 253, 247, .97);
    border: 1px solid #e8d6ba;
    box-shadow: 0 22px 60px rgba(96, 70, 38, .22);
    transform: translateY(14px) scale(.96);
    transition: transform .5s cubic-bezier(.34, 1.4, .64, 1);
  }

  .finale.show .finale-card { transform: translateY(0) scale(1); }

  .finale-badge {
    display: inline-block;
    font-size: 10.5px;
    letter-spacing: 2px;
    color: #946312;
    background: linear-gradient(180deg, #fdf1d3, #f8e2b4);
    border: 1px solid #edd3a0;
    border-radius: 999px;
    padding: 3px 12px;
    margin-bottom: 10px;
  }

  .finale-card h2 {
    margin: 0 0 8px;
    font-family: var(--serif);
    font-size: 26px;
    letter-spacing: 2px;
    color: #3a2a18;
  }

  .finale-card p {
    margin: 0 0 14px;
    font-size: 12.5px;
    line-height: 1.75;
    color: #6b5a47;
  }

  .finale-stats {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 18px;
  }

  .stat {
    flex: 1;
    padding: 9px 6px;
    border-radius: 11px;
    background: #fbf5ea;
    border: 1px solid #efe2cc;
  }

  .stat b {
    display: block;
    font-size: 17px;
    font-family: var(--serif);
    color: var(--brand);
    line-height: 1.3;
  }

  .stat span { font-size: 10.5px; color: var(--ink-3); letter-spacing: .5px; }

  /* ---------------- SVG 动画 ---------------- */
  .node-ring {
    fill: rgba(255, 253, 248, .95);
    stroke: #cdb392;
    stroke-width: 2;
    transition: stroke .3s, fill .3s;
  }

  .node.is-active .node-ring {
    stroke: var(--brand);
    animation: nodePulse 1.8s infinite;
  }

  @keyframes nodePulse {
    0% { stroke-width: 2; }
    50% { stroke-width: 4; }
    100% { stroke-width: 2; }
  }

  .node.is-done .node-ring { fill: #f3faf6; stroke: #2f9e6f; }

  .node-num {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 700;
    fill: #9a8264;
    text-anchor: middle;
    dominant-baseline: central;
    transition: fill .3s;
  }

  .node.is-active .node-num { fill: var(--brand); }
  .node.is-done .node-num { fill: #2f9e6f; }

  .node-label {
    font-family: var(--sans);
    font-size: 11px;
    fill: #7d6a53;
    text-anchor: middle;
    opacity: 0;
    transition: opacity .35s ease;
  }

  .node.is-active .node-label,
  .node.is-done .node-label { opacity: 1; }

  .node-label-bg {
    fill: rgba(255, 253, 248, .92);
    stroke: rgba(205, 179, 146, .8);
    stroke-width: 1;
    opacity: 0;
    transition: opacity .35s ease;
  }

  .node.is-active .node-label-bg,
  .node.is-done .node-label-bg { opacity: 1; }

  .torch .flame,
  .torch .flame-glow { opacity: 0; transition: opacity .45s ease; }

  .torch.lit .flame,
  .torch.lit .flame-glow { opacity: 1; }

  .torch.lit .flame {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: flicker 1.1s ease-in-out infinite;
  }

  @keyframes flicker {
    0%, 100% { transform: scale(1, 1); }
    35% { transform: scale(.93, 1.12); }
    70% { transform: scale(1.06, .95); }
  }

  .fog ellipse {
    animation: fogDrift 9s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }

  .fog ellipse:nth-child(2) { animation-duration: 11s; animation-delay: -3s; }
  .fog ellipse:nth-child(3) { animation-duration: 13s; animation-delay: -6s; }

  @keyframes fogDrift {
    0%, 100% { transform: translateX(-16px); opacity: .5; }
    50% { transform: translateX(16px); opacity: .78; }
  }

  .firefly { animation: firefly 3.4s ease-in-out infinite; }
  .firefly:nth-child(2n) { animation-delay: -1.2s; animation-duration: 4.1s; }
  .firefly:nth-child(3n) { animation-delay: -2.3s; animation-duration: 3s; }

  @keyframes firefly {
    0%, 100% { opacity: .18; }
    50% { opacity: 1; }
  }

  #chestLid {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    transition: transform .85s cubic-bezier(.34, 1.5, .64, 1);
  }

  #chest.open #chestLid { transform: rotate(-112deg); }
  #chestGlow { opacity: 0; transition: opacity .6s ease; }
  #chest.open #chestGlow { opacity: 1; }

  #guard { transition: opacity .5s ease, transform .5s ease; transform-box: fill-box; }
  #guard.alarm { animation: guardShake .5s ease-in-out 2; }
  @keyframes guardShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  /* ---------------- 响应式 ---------------- */
  @media (max-width: 1080px) {
    .app { padding: 18px 16px 26px; }
  }

  @media (max-width: 700px) {
    h1 { font-size: 15.5px; letter-spacing: 0; }
    .sub { font-size: 10.5px; }
    .seal { width: 40px; height: 40px; font-size: 19px; }
    .caption { width: calc(100% - 28px); left: 14px; top: 42px; padding: 9px 11px 10px; }
    .cap-title { font-size: 13px; }
    .cap-text {
      font-size: 11.5px;
      min-height: 0;
      line-height: 1.62;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .compass { display: none; }
    .app { width: 100%; }
    .stage { height: auto; width: 100%; aspect-ratio: 4 / 3; }
    .finale-card h2 { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="seal">宝</div>
      <div>
        <h1>寻宝之旅 <span class="dot">·</span> JavaScript 异步探险</h1>
        <p class="sub">实验二 &nbsp;|&nbsp; Promise → async / await 可视化演示</p>
      </div>
    </div>
  </header>

  <main class="stage-wrap">
    <!-- ================= 舞台 ================= -->
    <section class="stage" id="stage">
      <svg id="scene" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fffaf1" />
            <stop offset="42%" stop-color="#f9e8cb" />
            <stop offset="100%" stop-color="#eed2a6" />
          </linearGradient>

          <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#e5ca9f" />
            <stop offset="100%" stop-color="#cbaa77" />
          </linearGradient>

          <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#e3cba6" />
            <stop offset="100%" stop-color="#cbaa7e" />
          </linearGradient>

          <linearGradient id="hallWall" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#b0875b" />
            <stop offset="52%" stop-color="#c9a375" />
            <stop offset="100%" stop-color="#dcc09a" />
          </linearGradient>

          <linearGradient id="hallShade" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#5f4128" stop-opacity=".62" />
            <stop offset="100%" stop-color="#5f4128" stop-opacity="0" />
          </linearGradient>

          <radialGradient id="glow">
            <stop offset="0%" stop-color="#fbc85a" stop-opacity=".95" />
            <stop offset="55%" stop-color="#f7b23f" stop-opacity=".35" />
            <stop offset="100%" stop-color="#f7b23f" stop-opacity="0" />
          </radialGradient>

          <radialGradient id="goldBurst">
            <stop offset="0%" stop-color="#fff3c4" stop-opacity=".95" />
            <stop offset="100%" stop-color="#f6c945" stop-opacity="0" />
          </radialGradient>

          <filter id="softBlur" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="9" />
          </filter>

          <filter id="tinyBlur" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="2.4" />
          </filter>
        </defs>

        <!-- 天空 -->
        <rect x="0" y="0" width="1000" height="560" fill="url(#sky)" />

        <!-- 远景（视差 0.25） -->
        <g id="camFar">
          <circle cx="168" cy="118" r="130" fill="url(#glow)" opacity=".45" />
          <circle cx="168" cy="118" r="42" fill="#fbe3ae" />
          <circle cx="168" cy="118" r="42" fill="none" stroke="#f0cf8e" stroke-width="1.4" />

          <g fill="#fffbf2" opacity=".9">
            <ellipse cx="420" cy="92" rx="58" ry="15" />
            <ellipse cx="458" cy="80" rx="36" ry="14" />
            <ellipse cx="880" cy="132" rx="66" ry="14" />
            <ellipse cx="918" cy="122" rx="38" ry="12" />
            <ellipse cx="1230" cy="86" rx="52" ry="13" />
            <ellipse cx="1262" cy="78" rx="30" ry="11" />
          </g>

          <g stroke="#c9a878" stroke-width="1.6" fill="none" opacity=".55" stroke-linecap="round">
            <path d="M600,150 q9,-7 18,0 q9,-7 18,0" />
            <path d="M646,164 q7,-6 14,0 q7,-6 14,0" />
            <path d="M1090,120 q8,-6 16,0 q8,-6 16,0" />
          </g>

          <path d="M-100,438 L40,312 L168,414 L268,346 L392,438 L520,326 L648,438 L772,356 L896,438 L1032,318 L1170,438 L1290,352 L1430,438 L1600,438 L1600,560 L-100,560 Z"
                fill="#e8cfa6" />
          <path d="M40,312 L168,414 M520,326 L648,438 M1032,318 L1170,438"
                stroke="#dcc199" stroke-width="2" fill="none" />
        </g>

        <!-- 中景（视差 0.55） -->
        <g id="camMid">
          <path d="M-100,472 L120,392 L336,472 L556,406 L756,472 L976,398 L1196,472 L1416,410 L1646,472 L1880,472 L1880,560 L-100,560 Z"
                fill="#ddc096" />

          <path d="M1478,472 L1552,382 L1626,472 Z" fill="#d6b78c" />
          <path d="M1600,472 L1656,404 L1712,472 Z" fill="#ddc197" />

          <path d="M-100,484 C 200,458 420,504 700,482 C 980,460 1200,502 1500,482 C 1750,466 1980,494 2160,482 L2160,560 L-100,560 Z"
                fill="#e4cda6" />
        </g>

        <!-- 世界层（视差 1.0） -->
        <g id="camWorld">

          <!-- 地面 -->
          <path d="M0,488 C 220,472 420,494 640,478 C 860,462 1060,492 1280,476 C 1500,460 1700,494 1900,478 C 2100,464 2270,488 2400,474 L2400,560 L0,560 Z"
                fill="url(#groundGrad)" />
          <path d="M0,488 C 220,472 420,494 640,478 C 860,462 1060,492 1280,476 C 1500,460 1700,494 1900,478 C 2100,464 2270,488 2400,474"
                stroke="#e4cba3" stroke-width="2.5" fill="none" opacity=".9" />

          <!-- 零散石头 -->
          <g fill="#d3b78e" opacity=".75">
            <ellipse cx="360" cy="500" rx="14" ry="5" />
            <ellipse cx="620" cy="512" rx="9" ry="4" />
            <ellipse cx="960" cy="502" rx="16" ry="5" />
            <ellipse cx="1450" cy="508" rx="12" ry="4.5" />
            <ellipse cx="2160" cy="512" rx="15" ry="5" />
          </g>

  function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
  function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function nowTime() {
    var d = new Date();

  function AbortError() { this.name = 'Abort'; this.message = '任务已重置'; }

  // 1. 异步 API —— 与原版 TreasureMap 保持一致，并扩展新情节

  var TreasureMap = {
    getInitialClue: function () {
      return delay(1000).then(function () {
        return '在古老的图书馆里找到了第一个线索：一张残破的羊皮卷。';
      });

    decodeAncientScript: function (clue) {
      return delay(1500).then(function () {

      });
    },

    // 新情节 ③：夜观星象
    readStarMap: function (location) {
      return delay(1200).then(function () {
        if (!location || location.indexOf('神庙') === -1) {
          throw new Error('星象与羊皮卷对不上，方位无法确定！');

        return '星象确认：向东北三百里，穿过迷雾森林即可看见神庙。';
      });
    },

    // 新情节 ④：穿越迷雾森林（可能迷路）
    crossMistForest: function (route, attempt) {
      return delay(1400).then(function () {
        var lostChance = attempt === 1 ? 0.62 : 0.12;
        if (Math.random() < lostChance) {
          throw new Error('浓雾遮住了去路，你在第 ' + attempt + ' 次尝试中迷路了……');

  function catmullRom(points) {
    var d = 'M ' + points[0].x + ' ' + points[0].y;

      var p0 = points[i - 1] || points[i];

      var c1y = p1.y + (p2.y - p0.y) / 6;
      var c2x = p2.x - (p3.x - p1.x) / 6;
      var c2y = p2.y - (p3.y - p1.y) / 6;
      d += ' C ' + c1x.toFixed(2) + ' ' + c1y.toFixed(2) + ', ' +
           c2x.toFixed(2) + ' ' + c2y.toFixed(2) + ', ' +
           p2.x + ' ' + p2.y;
    }
    return d;
  }

  var pathD = catmullRom(WAYPOINTS);
  trailBase.setAttribute('d', pathD);

    var best = 0, bestD = Infinity;
    for (var i = 0; i <= 900; i++) {
      var l = trailTotal * i / 900;
      var q = trailBase.getPointAtLength(l);
      var dd = (q.x - pt.x) * (q.x - pt.x) + (q.y - pt.y) * (q.y - pt.y);
      if (dd < bestD) { bestD = dd; best = l; }
    }
    return best;
  }

  var particles = [];

  function loop(now) {
    var dt = Math.min(64, now - lastFrame);
    lastFrame = now;

    var pt = trailBase.getPointAtLength(state.heroT);
    var bob = state.walking ? Math.sin(now / 92) * 1.7 : 0;

    trailDone.style.strokeDashoffset = Math.max(0, trailTotal - state.heroT);

        });

    updateParticles(dt);

  }

  function spawnParticle(x, y, opt) {
    var c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', x.toFixed(1));
    c.setAttribute('cy', y.toFixed(1));
    c.setAttribute('r', opt.r.toFixed(1));
    c.setAttribute('fill', opt.color);
    c.setAttribute('opacity', '1');
    fxLayer.appendChild(c);
    particles.push({
      el: c, x: x, y: y,
      vx: opt.vx, vy: opt.vy,
      gravity: opt.gravity === undefined ? 320 : opt.gravity,
      life: 0, max: opt.max || 900, r: opt.r
    });
  }

  function burst(x, y, count, colors) {
    for (var i = 0; i < count; i++) {
      var angle = Math.random() * Math.PI * 2;
      var speed = 60 + Math.random() * 220;
      spawnParticle(x, y, {
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 90,
        r: Math.random() * 2.8 + 1.4,
        color: colors[(Math.random() * colors.length) | 0],
        max: 900 + Math.random() * 700,
        gravity: 300
      });
    }
  }

  function updateParticles(dt) {
    var s = dt / 1000;
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life += dt;
      p.vy += p.gravity * s;
      p.x += p.vx * s;
      p.y += p.vy * s;
      var k = 1 - p.life / p.max;
      if (p.life >= p.max || k <= 0) {
        fxLayer.removeChild(p.el);
        particles.splice(i, 1);
        continue;
      }
      p.el.setAttribute('cx', p.x.toFixed(1));
      p.el.setAttribute('cy', p.y.toFixed(1));
      p.el.setAttribute('opacity', Math.max(0, k).toFixed(2));
    }
  }

  // ===================================================================
  // 8. 异步控制：sleep / walkTo / withRetry
  // ===================================================================
  function checkAbort(id) {
    if (id !== state.runId) throw new AbortError();
  }

  function delay(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms / state.speed); });
  }

  function wait(ms) { return delay(ms); }

  function walkTo(index) {
    var id = state.runId;
    var from = state.heroT;
    var to = nodeLen[index];
    var duration = clamp(Math.abs(to - from) * 2.4 + 260, 420, 1250);

    return new Promise(function (resolve, reject) {
      var acc = 0;
      var last = performance.now();
      state.walking = true;

      function tick(now) {
        if (id !== state.runId) {
          state.walking = false;
          reject(new AbortError());
          return;
        }
        acc += (now - last) * state.speed;
        last = now;
        var p = Math.min(1, acc / duration);
        state.heroT = from + (to - from) * easeInOut(p);
        if (p < 1) {
          requestAnimationFrame(tick);
        } else {
          state.heroT = to;
          state.walking = false;
          resolve();
        }
      }
      requestAnimationFrame(tick);
    });
  }

  async function withRetry(task, times, onRetry) {
    var lastError;
    for (var attempt = 1; attempt <= times; attempt++) {
      try {
        return await task(attempt);
      } catch (error) {
        if (error && error.name === 'Abort') throw error;
        lastError = error;
        if (onRetry) onRetry(error, attempt);
        if (attempt === times) break;
        await wait(450);
      }
    }
    throw lastError;
  }

  // ===================================================================
  // 10. 寻宝主流程（页面的 async / await 版本）
  // ===================================================================
  async function findTreasure() {
    var id = state.runId;

    // ① 图书馆
    checkAbort(id);
    state.step = 0;
    setActiveNode(0);
    highlightCode(0);
    setCaption(0);
    log('▶ ' + NODES[0].title, 'start');
    await walkTo(0);
    var clue = await TreasureMap.getInitialClue();
    checkAbort(id);
    finishStep(0, clue);

    // ② 解码
    await goTo(1, id);
    var location = await TreasureMap.decodeAncientScript(clue);
    checkAbort(id);
    finishStep(1, location);

    // ③ 星象
    await goTo(2, id);
    var route = await TreasureMap.readStarMap(location);
    checkAbort(id);
    finishStep(2, route);

    // ④ 迷雾森林（失败重试）
    await goTo(3, id);
    var trail = await withRetry(
      function (attempt) { return TreasureMap.crossMistForest(route, attempt); },
      3,
      function (error, attempt) {
        state.retries++;
        log('⚠ 第 ' + attempt + ' 次尝试失败：' + error.message, 'warn');
        log('  await 被 reject，withRetry 稍后重试…', 'warn');
        shake();
      }
    );
    checkAbort(id);
    finishStep(3, trail);

    // ⑤ 三盏圣火（并发）
    await goTo(4, id);
    var torchStart = performance.now();
    var torches = await Promise.all([
      TreasureMap.lightTorch('日', 800).then(function (n) { lightTorch(0); return n; }),
      TreasureMap.lightTorch('月', 1100).then(function (n) { lightTorch(1); return n; }),
      TreasureMap.lightTorch('星', 1400).then(function (n) { lightTorch(2); return n; })
    ]);
    checkAbort(id);
    var torchCost = Math.round(performance.now() - torchStart);
    log('Promise.all 并发执行，三盏灯分别在 800 / 1100 / 1400ms 点亮', 'info');
    log('总耗时 ' + torchCost + 'ms —— 等于最慢的那一盏，而不是三者相加', 'ok');
    finishStep(4, NODES[4].done);

    // ⑥ 智取守卫
    await goTo(5, id);
    var box;
    try {
      box = await withRetry(
        function () { return TreasureMap.searchTemple(trail); },
        3,
        function (error, attempt) {
          state.retries++;
          log('⚠ 第 ' + attempt + ' 次潜入失败：' + error.message, 'warn');
          guardEl.classList.remove('alarm');
          void guardEl.offsetWidth;
          guardEl.classList.add('alarm');
          shake();
        }
      );
    } catch (error) {
      if (error && error.name === 'Abort') throw error;
      log('强攻失败，改用「声东击西」降级方案', 'warn');
      box = await TreasureMap.distractGuard();
      checkAbort(id);
    }
    finishStep(5, box);

    // ⑦ 开箱
    await goTo(6, id);
    var treasure = await TreasureMap.openTreasureBox();
    checkAbort(id);
    finishStep(6, treasure);

    // 结算
    finishRun(treasure);
  }

  async function goTo(i, id) {
    checkAbort(id);
    state.step = i;
    setActiveNode(i);
    highlightCode(NODES[i].code);
    setCaption(i);
    log('▶ ' + NODES[i].title, 'start');

  function finishStep(i, text) {
    markDone(i);
    setCaptionText(text);
    log(text, 'ok');
    state.done++;
    updateProgress();
    burst(WAYPOINTS[NODES[i].wp].x, WAYPOINTS[NODES[i].wp].y - 30, 10, ['#f0b95a', '#e88b4a', '#f7d98a']);

    if (i === 6) {
      chest.classList.add('open');
      burst(2270, 430, 60, ['#f7c948', '#ffe9a3', '#e59b2f', '#fff6d8']);
      setTimeout(function () { burst(2270, 420, 40, ['#f7c948', '#ffd166']); }, 350);
    }
  }

  function finishRun(treasure) {
    state.running = false;
    setStatus('寻宝完成', false);
    var seconds = ((performance.now() - state.t0) / 1000).toFixed(1);
    finaleText.textContent = treasure;
    statTime.textContent = seconds + 's';
    statRetry.textContent = state.retries + ' 次';
    setTimeout(function () { finale.classList.add('show'); }, 650);
    startBtn.disabled = false;
    startBtn.textContent = '重新寻宝';
    log('✨ 全部 await 完成，async 函数返回：' + treasure, 'ok');
  }

  function startRun() {
    if (state.running) return;
    resetScene();
    state.running = true;
    state.t0 = performance.now();
    setStatus('寻宝中', true);
    startBtn.disabled = true;
    startBtn.textContent = '寻宝中…';
    log('async findTreasure() 开始执行', 'start');

    findTreasure().catch(function (error) {
      if (error && error.name === 'Abort') return;
      console.error(error);
      log('✗ 任务中断：' + error.message, 'err');
      setStatus('已中断', false);
      state.running = false;
      startBtn.disabled = false;
      startBtn.textContent = '重新寻宝';
    });
  }

  // 初始化
  updateProgress();
  requestAnimationFrame(function (t) { lastFrame = t; loop(t); });
})();
</script>
